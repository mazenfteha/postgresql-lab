  <rect x="583" y="40" width="50" height="2" fill="#3fb950" class="s2"/>
  <rect x="660" y="40" width="65" height="2" fill="#d29922" class="s3"/>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#21262d"/>

