  <rect x="0.5" y="0.5" width="799" height="399" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="36" font-size="17" font-weight="700">05 · Stores near me with PostGIS</text>
  <text x="500" y="34" font-size="12" class="muted">1 POINTS</text>
  <text x="583" y="34" font-size="12" class="muted">2 INDEX</text>
  <text x="660" y="34" font-size="12" class="muted">3 NEAREST</text>
