    <circle cx="210" cy="215" r="50" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950" stroke-width="1.5"/>
    <g fill="#3fb950"><circle cx="211.4" cy="222.6" r="2.6"/><circle cx="197.8" cy="216" r="2.6"/><circle cx="219" cy="199.8" r="2.6"/><circle cx="221.2" cy="229.8" r="2.6"/><circle cx="229.2" cy="227.3" r="2.6"/><circle cx="217.7" cy="192.1" r="2.6"/><circle cx="232.6" cy="202.1" r="2.6"/><circle cx="231.6" cy="235.5" r="2.6"/><circle cx="240.4" cy="217.4" r="2.6"/><circle cx="186.1" cy="192.4" r="2.6"/><circle cx="238.8" cy="199" r="2.6"/><circle cx="181.2" cy="233.3" r="2.6"/><circle cx="175.8" cy="221.6" r="2.6"/><circle cx="229.8" cy="186.2" r="2.6"/><circle cx="217.4" cy="179.4" r="2.6"/><circle cx="215.9" cy="252.8" r="2.6"/><circle cx="236.9" cy="186.7" r="2.6"/><circle cx="174.6" cy="197.9" r="2.6"/><circle cx="181.7" cy="242.5" r="2.6"/><circle cx="169.5" cy="206.8" r="2.6"/><circle cx="214.1" cy="173.6" r="2.6"/><circle cx="225.4" cy="175.2" r="2.6"/><circle cx="208.8" cy="171.6" r="2.6"/><circle cx="211.1" cy="169.1" r="2.6"/><circle cx="233" cy="174.6" r="2.6"/><circle cx="223.8" cy="170.4" r="2.6"/><circle cx="257.1" cy="221.9" r="2.6"/><circle cx="177.5" cy="250.1" r="2.6"/><circle cx="193.2" cy="169.9" r="2.6"/><circle cx="246.4" cy="247.4" r="2.6"/><circle cx="173.7" cy="181.9" r="2.6"/></g>
