  <path d="M210 205 l2.9 6.1 6.6 .7 -4.9 4.5 1.4 6.5 -6 -3.4 -6 3.4 1.4 -6.5 -4.9 -4.5 6.6 -.7 Z" transform="translate(0 -4)" fill="#e6edf3" stroke="#0d1117"/>

  <!-- Scene 1: points on the globe -->
  <g class="s1">
    <text x="60" y="76" font-size="12" class="muted">1 · each store is a point on the globe</text>
    <text x="380" y="112" font-size="14" class="pop" style="animation-delay:0.3s">200 stores · random points</text>
    <text x="380" y="132" font-size="14" class="pop" style="animation-delay:0.3s">within 25 km of Cairo</text>
    <text x="380" y="172" font-size="12" class="muted pop" style="animation-delay:1.2s">column type</text>
    <text x="380" y="192" font-size="14" class="blue pop" style="animation-delay:1.2s">geography(Point, 4326)</text>
    <text x="380" y="212" font-size="12" class="muted pop" style="animation-delay:1.2s">lng/lat on the real Earth, meters</text>
    <text x="380" y="252" font-size="12" class="muted pop" style="animation-delay:2.4s">★ customer at Tahrir Square</text>
    <text x="380" y="276" font-size="14" class="pop" style="animation-delay:2.4s">ST_MakePoint(<tspan class="amber">31.2357</tspan>, 30.0444)</text>
    <text x="380" y="296" font-size="12" class="amber pop" style="animation-delay:3.2s">↑ longitude FIRST, then latitude</text>
    <text x="60" y="372" font-size="13">"Which stores are within 10 km of this customer, nearest first?"</text>
  </g>

  <!-- Scene 2: GiST bounding box, then exact check -->
  <g class="s2">
    <text x="60" y="76" font-size="12" class="muted">2 · WHERE ST_DWithin(location, point, 10000)</text>
    <g class="pop" style="animation-delay:6.5s">
      <rect x="160" y="165" width="100" height="100" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="5 3"/>
      <g fill="#d29922"><circle cx="163.9" cy="261.3" r="2.6"/><circle cx="167.8" cy="168.9" r="2.6"/><circle cx="166.6" cy="186.4" r="2.6"/><circle cx="160.9" cy="252.7" r="2.6"/><circle cx="168.3" cy="243.5" r="2.6"/><circle cx="254.5" cy="190.9" r="2.6"/><circle cx="161.6" cy="232.4" r="2.6"/><circle cx="259.5" cy="165.4" r="2.6"/><circle cx="162.1" cy="242.8" r="2.6"/><circle cx="165.8" cy="184.2" r="2.6"/></g>
    </g>
    <g class="pop" style="animation-delay:6.5s">
      <text x="380" y="112" font-size="12" class="muted">step 1 · GiST index (cheap box test)</text>
      <text x="380" y="134" font-size="14">location <tspan class="blue">&amp;&amp;</tspan> box around 10 km</text>
      <text x="380" y="156" font-size="15" font-weight="700" class="blue">→ 53 candidates</text>
    </g>
    <g class="pop" style="animation-delay:8.3s">
      <text x="380" y="196" font-size="12" class="muted">step 2 · exact distance on the globe</text>
      <text x="380" y="218" font-size="14">box corners are not in the circle</text>
      <text x="380" y="240" font-size="15" font-weight="700" class="amber">→ Rows Removed by Filter: 22</text>
    </g>
    <g class="pop" style="animation-delay:10s">
      <text x="380" y="282" font-size="18" font-weight="700" class="green">= 31 stores within 10 km</text>
      <text x="380" y="304" font-size="12" class="muted">(math check: 200 × (10/25)² ≈ 32)</text>
    </g>
    <text x="60" y="372" font-size="13">The index throws away the far stores without computing a single distance.</text>
  </g>

  <!-- Scene 3: nearest first + timing -->
  <g class="s3">
    <text x="60" y="76" font-size="12" class="muted">3 · ORDER BY ST_Distance(location, point)</text>
    <g class="pop" style="animation-delay:12.4s">
      <line x1="210" y1="215" x2="211.4" y2="222.6" stroke="#e6edf3" stroke-width="1.5"/>
      <line x1="210" y1="215" x2="197.8" y2="216" stroke="#e6edf3" stroke-width="1.5"/>
      <circle cx="211.4" cy="222.6" r="4" fill="none" stroke="#e6edf3"/>
      <circle cx="197.8" cy="216" r="4" fill="none" stroke="#e6edf3"/>
    </g>
    <g font-size="14">
      <g class="pop" style="animation-delay:12.4s"><text x="380" y="112">1. Store 010</text><text x="740" y="112" text-anchor="end" class="green">1.54 km</text></g>
      <g class="pop" style="animation-delay:12.9s"><text x="380" y="136">2. Store 061</text><text x="740" y="136" text-anchor="end" class="green">2.44 km</text></g>
      <g class="pop" style="animation-delay:13.4s"><text x="380" y="160" class="muted">…  31 rows, increasing distance</text></g>
    </g>
    <g class="pop" style="animation-delay:14.4s">
      <text x="380" y="200" font-size="12" class="muted">EXPLAIN ANALYZE</text>
      <text x="380" y="222" font-size="14" class="blue">Index Scan using store_location_gist</text>
      <text x="380" y="248" font-size="18" font-weight="700" class="green">0.22 ms</text>
      <text x="470" y="248" font-size="12" class="muted">warm  (37.5 ms on first call)</text>
    </g>
    <g class="pop" style="animation-delay:16s" font-size="13">
      <text x="380" y="288">2 km radius     → <tspan class="green">1 store</tspan></text>
      <text x="380" y="310">from Alexandria → <tspan class="red">0 stores</tspan></text>
    </g>
    <text x="60" y="372" font-size="13">Real distances in meters on a round Earth, served by a GiST index.</text>
  </g>
</svg>
