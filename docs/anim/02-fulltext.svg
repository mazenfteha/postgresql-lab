<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
  <title id="t">Phase 02: Full-text search in Postgres</title>
  <desc id="d">Three scenes. 1: ILIKE '%term%' scans all 5,000 rows in 9.6 ms. 2: full-text search stems "cleaning" to "clean" and uses a GIN index, 0.15 ms, 66 times faster. 3: pg_trgm splits words into 3-letter chunks; the typo "tnnis" shares 4 chunks with "tennis", scoring 0.58, which passes once the threshold is lowered from 0.6 to 0.5.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #e6edf3; }
    .muted { fill: #8b949e; }
    .red { fill: #f85149; } .green { fill: #3fb950; } .blue { fill: #58a6ff; }
    .s1, .s2, .s3, .grid, .pop, .blink, .grow, .slide, .fill {
      animation-duration: 20s; animation-iteration-count: infinite; animation-fill-mode: both;
    }
    .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; }
    .grid { animation-name: grid; }
    .pop { animation-name: pop; animation-timing-function: ease-out; }
    .blink { animation-name: blink; }
    .grow { animation-name: grow; animation-timing-function: linear; transform-box: fill-box; transform-origin: 0 50%; }
    .slide { animation-name: slide; animation-timing-function: linear; }
    .fill { animation-name: fill; animation-timing-function: ease-out; transform-box: fill-box; transform-origin: 0 50%; }

    /* 20s loop: scene 1 = 0-6s, scene 2 = 6-12s, scene 3 = 12-20s */
    @keyframes s1   { 0% { opacity: 0 } 2.5% { opacity: 1 } 27.5% { opacity: 1 } 30% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes s2   { 0%, 30% { opacity: 0 } 32.5% { opacity: 1 } 57.5% { opacity: 1 } 60% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes s3   { 0%, 60% { opacity: 0 } 62.5% { opacity: 1 } 97.5% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes grid { 0% { opacity: 0 } 2.5% { opacity: 1 } 57.5% { opacity: 1 } 60% { opacity: 0 } 100% { opacity: 0 } }
    /* relative to each element's animation-delay */
    @keyframes pop   { 0% { opacity: 0 } 3% { opacity: 1 } 40% { opacity: 1 } 42% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes blink { 0% { opacity: 0 } 3% { opacity: 1 } 9% { opacity: 1 } 11% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes grow  { 0% { transform: scaleX(0) } 14% { transform: scaleX(1) } 40% { transform: scaleX(1) } 42% { transform: scaleX(0) } 100% { transform: scaleX(0) } }
    @keyframes slide { 0% { transform: translateX(0) } 14% { transform: translateX(680px) } 40% { transform: translateX(680px) } 42% { transform: translateX(0) } 100% { transform: translateX(0) } }
    @keyframes fill  { 0% { transform: scaleX(0) } 7% { transform: scaleX(0.58) } 40% { transform: scaleX(0.58) } 42% { transform: scaleX(0) } 100% { transform: scaleX(0) } }
  </style>

  <defs>
    <pattern id="cells" x="60" y="140" width="34" height="28" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="30" height="22" rx="3" fill="#21262d"/>
    </pattern>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="799" height="399" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="36" font-size="17" font-weight="700">02 · Full-text search in Postgres</text>
  <text x="520" y="34" font-size="12" class="muted">1 ILIKE</text>
  <text x="605" y="34" font-size="12" class="muted">2 FTS</text>
  <text x="672" y="34" font-size="12" class="muted">3 TRIGRAM</text>
  <rect x="520" y="40" width="50" height="2" fill="#f85149" class="s1"/>
  <rect x="605" y="40" width="36" height="2" fill="#3fb950" class="s2"/>
  <rect x="672" y="40" width="65" height="2" fill="#58a6ff" class="s3"/>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#21262d"/>

  <!-- product table: 100 blocks x 50 rows = 5,000 rows (scenes 1 and 2) -->
  <g class="grid">
    <text x="60" y="134" font-size="11" class="muted">Product table · each block ≈ 50 rows · 5,000 rows</text>
    <rect x="60" y="140" width="680" height="140" fill="url(#cells)"/>
  </g>

  <!-- Scene 1: ILIKE = sequential scan -->
  <g class="s1">
    <text x="60" y="76" font-size="12" class="muted">1 · substring search</text>
    <text x="60" y="108" font-size="14">WHERE name <tspan class="red">ILIKE</tspan> '%headphones%' OR description <tspan class="red">ILIKE</tspan> '%headphones%'</text>
    <rect x="60" y="140" width="680" height="140" fill="#f85149" fill-opacity="0.16" class="grow" style="animation-delay:0.4s"/>
    <rect x="58" y="136" width="4" height="148" rx="2" fill="#f85149" class="slide" style="animation-delay:0.4s"/>
    <g class="pop" style="animation-delay:3.2s" fill="#3fb950">
      <rect x="130" y="171" width="30" height="22" rx="3"/>
      <rect x="232" y="255" width="30" height="22" rx="3"/>
      <rect x="300" y="227" width="30" height="22" rx="3"/>
      <rect x="436" y="143" width="30" height="22" rx="3"/>
      <rect x="538" y="255" width="30" height="22" rx="3"/>
      <rect x="640" y="199" width="30" height="22" rx="3"/>
    </g>
    <text x="60" y="314" font-size="14" class="green pop" style="animation-delay:3.2s">104 matching rows</text>
    <text x="740" y="314" font-size="15" font-weight="700" text-anchor="end" class="red pop" style="animation-delay:3.2s">Seq Scan · read all 5,000 rows · 9.6 ms</text>
    <text x="60" y="362" font-size="13">No index can help '%term%', so Postgres reads and string-matches every row.</text>
  </g>

  <!-- Scene 2: tsvector + GIN -->
  <g class="s2">
    <text x="60" y="76" font-size="12" class="muted">2 · full-text: search_vector @@ websearch_to_tsquery('english', 'cleaning')</text>
    <g class="pop" style="animation-delay:6.3s">
      <rect x="60" y="88" width="150" height="32" rx="6" fill="none" stroke="#58a6ff"/>
      <text x="135" y="109" font-size="14" text-anchor="middle">'cleaning'</text>
    </g>
    <g class="pop" style="animation-delay:6.9s">
      <line x1="214" y1="104" x2="258" y2="104" stroke="#8b949e" stroke-width="1.5"/>
      <path d="M252 99 L260 104 L252 109 Z" fill="#8b949e"/>
      <text x="236" y="97" font-size="10" text-anchor="middle" class="muted">stem</text>
      <rect x="266" y="88" width="110" height="32" rx="6" fill="none" stroke="#58a6ff"/>
      <text x="321" y="109" font-size="14" text-anchor="middle" class="blue">clean</text>
    </g>
    <g class="pop" style="animation-delay:7.5s">
      <line x1="380" y1="104" x2="424" y2="104" stroke="#8b949e" stroke-width="1.5"/>
      <path d="M418 99 L426 104 L418 109 Z" fill="#8b949e"/>
      <text x="402" y="97" font-size="10" text-anchor="middle" class="muted">GIN</text>
      <rect x="432" y="88" width="308" height="32" rx="6" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950"/>
      <text x="586" y="109" font-size="13" text-anchor="middle">clean → rows 61, 188, …</text>
    </g>
    <g class="pop" style="animation-delay:8.1s" fill="#3fb950">
      <rect x="130" y="171" width="30" height="22" rx="3"/>
      <rect x="232" y="255" width="30" height="22" rx="3"/>
      <rect x="300" y="227" width="30" height="22" rx="3"/>
      <rect x="436" y="143" width="30" height="22" rx="3"/>
      <rect x="538" y="255" width="30" height="22" rx="3"/>
      <rect x="640" y="199" width="30" height="22" rx="3"/>
    </g>
    <text x="60" y="314" font-size="14" class="muted pop" style="animation-delay:8.7s">only matching rows are read</text>
    <text x="740" y="314" font-size="15" font-weight="700" text-anchor="end" class="green pop" style="animation-delay:8.7s">Bitmap Index Scan · 0.15 ms · 66× faster</text>
    <text x="60" y="362" font-size="13">Words are stemmed (cleaning → clean), then looked up in a GIN index.</text>
  </g>

  <!-- Scene 3: pg_trgm -->
  <g class="s3">
    <text x="60" y="76" font-size="12" class="muted">3 · fuzzy (pg_trgm): compare spellings as 3-letter chunks</text>

    <g class="pop" style="animation-delay:12.3s">
      <text x="60" y="111" font-size="14" class="red">typo 'tnnis'</text>
      <g fill="#161b22" stroke="#30363d">
        <rect x="200" y="92" width="62" height="28" rx="5"/><rect x="270" y="92" width="62" height="28" rx="5"/>
        <rect x="340" y="92" width="62" height="28" rx="5"/><rect x="410" y="92" width="62" height="28" rx="5"/>
        <rect x="480" y="92" width="62" height="28" rx="5"/><rect x="550" y="92" width="62" height="28" rx="5"/>
      </g>
    </g>
    <g class="pop" style="animation-delay:12.8s">
      <text x="60" y="159" font-size="14">name 'tennis'</text>
      <g fill="#161b22" stroke="#30363d">
        <rect x="200" y="140" width="62" height="28" rx="5"/><rect x="270" y="140" width="62" height="28" rx="5"/>
        <rect x="340" y="140" width="62" height="28" rx="5"/><rect x="410" y="140" width="62" height="28" rx="5"/>
        <rect x="480" y="140" width="62" height="28" rx="5"/><rect x="550" y="140" width="62" height="28" rx="5"/>
        <rect x="620" y="140" width="62" height="28" rx="5"/>
      </g>
    </g>
    <!-- shared chunks light up -->
    <g class="pop" style="animation-delay:13.4s" fill="#3fb950" fill-opacity="0.22" stroke="#3fb950">
      <rect x="200" y="92" width="62" height="28" rx="5"/><rect x="410" y="92" width="62" height="28" rx="5"/>
      <rect x="480" y="92" width="62" height="28" rx="5"/><rect x="550" y="92" width="62" height="28" rx="5"/>
      <rect x="200" y="140" width="62" height="28" rx="5"/><rect x="480" y="140" width="62" height="28" rx="5"/>
      <rect x="550" y="140" width="62" height="28" rx="5"/><rect x="620" y="140" width="62" height="28" rx="5"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <g class="pop" style="animation-delay:12.3s">
        <text x="231" y="111">␣␣t</text><text x="301" y="111">␣tn</text><text x="371" y="111">tnn</text>
        <text x="441" y="111">nni</text><text x="511" y="111">nis</text><text x="581" y="111">is␣</text>
      </g>
      <g class="pop" style="animation-delay:12.8s">
        <text x="231" y="159">␣␣t</text><text x="301" y="159">␣te</text><text x="371" y="159">ten</text>
        <text x="441" y="159">enn</text><text x="511" y="159">nni</text><text x="581" y="159">nis</text><text x="651" y="159">is␣</text>
      </g>
    </g>
    <text x="60" y="202" font-size="13" class="green pop" style="animation-delay:13.4s">4 chunks shared → still similar despite the typo</text>

    <text x="100" y="234" font-size="12" class="muted">word_similarity('tnnis rackt', 'Lightweight Bamboo Tennis Racket')</text>
    <rect x="100" y="244" width="600" height="18" rx="4" fill="#21262d"/>
    <text x="92" y="258" font-size="11" text-anchor="end" class="muted">0</text>
    <text x="708" y="258" font-size="11" class="muted">1</text>
    <rect x="100" y="244" width="600" height="18" rx="4" fill="#58a6ff" class="fill" style="animation-delay:14s"/>
    <text x="100" y="292" font-size="14" font-weight="700" class="blue pop" style="animation-delay:15.2s">score 0.58</text>

    <g class="blink" style="animation-delay:15.6s">
      <line x1="460" y1="236" x2="460" y2="270" stroke="#f85149" stroke-width="2"/>
      <text x="740" y="292" font-size="14" font-weight="700" text-anchor="end" class="red">default threshold 0.6 → ✗ no match</text>
    </g>
    <g class="pop" style="animation-delay:17.4s">
      <line x1="400" y1="236" x2="400" y2="270" stroke="#3fb950" stroke-width="2"/>
      <text x="740" y="292" font-size="14" font-weight="700" text-anchor="end" class="green">threshold 0.5 → ✓ Tennis Racket</text>
    </g>
    <text x="60" y="362" font-size="13">A typo still shares most 3-letter chunks, so the name scores close enough.</text>
  </g>
</svg>
