<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
  <title id="t">Phase 06: Unlogged tables as a cache</title>
  <desc id="d">Three scenes. 1: the same 200,000 upserts go into a normal table, which writes 67 MB of WAL, and an unlogged table, which writes 1.1 MB; both take about 15 s. 2: after docker compose kill, the logged table still has its row (replayed from the WAL) and the unlogged table is empty. 3: the product cache returns MISS then HIT; a price update fires a trigger that deletes the cached copy, so the next read is a MISS with the new price, even when the update comes from psql.</desc>
  <style>
    /* hover to pause (works when the SVG is opened directly; GitHub README images ignore hover) */
    svg:hover * { animation-play-state: paused; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #e6edf3; }
    .muted { fill: #8b949e; }
    .red { fill: #f85149; } .green { fill: #3fb950; } .blue { fill: #58a6ff; } .amber { fill: #d29922; }
    .s1, .s2, .s3, .pop, .brief, .grow {
      animation-duration: 40s; animation-iteration-count: infinite; animation-fill-mode: both;
    }
    .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; }
    .pop { animation-name: pop; animation-timing-function: ease-out; }
    .brief { animation-name: brief; }
    .grow { animation-name: grow; animation-timing-function: linear; transform-box: fill-box; transform-origin: 0 50%; }

    /* 40s loop: scene 1 = 0-12s, scene 2 = 12-24s, scene 3 = 24-40s */
    @keyframes s1 { 0% { opacity: 0 } 2.5% { opacity: 1 } 27.5% { opacity: 1 } 30% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes s2 { 0%, 30% { opacity: 0 } 32.5% { opacity: 1 } 57.5% { opacity: 1 } 60% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes s3 { 0%, 60% { opacity: 0 } 62.5% { opacity: 1 } 97.5% { opacity: 1 } 100% { opacity: 0 } }
    /* relative to each element's animation-delay */
    @keyframes pop   { 0% { opacity: 0 } 3% { opacity: 1 } 40% { opacity: 1 } 42% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes brief { 0% { opacity: 0 } 2% { opacity: 1 } 11% { opacity: 1 } 12% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes grow  { 0% { transform: scaleX(0) } 10% { transform: scaleX(1) } 40% { transform: scaleX(1) } 42% { transform: scaleX(0) } 100% { transform: scaleX(0) } }
  </style>

  <!-- card -->
  <rect x="0.5" y="0.5" width="799" height="399" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="36" font-size="17" font-weight="700">06 · Unlogged tables as a cache</text>
  <text x="500" y="34" font-size="12" class="muted">1 WAL</text>
  <text x="560" y="34" font-size="12" class="muted">2 CRASH</text>
  <text x="640" y="34" font-size="12" class="muted">3 CACHE</text>
  <rect x="500" y="40" width="36" height="2" fill="#58a6ff" class="s1"/>
  <rect x="560" y="40" width="50" height="2" fill="#f85149" class="s2"/>
  <rect x="640" y="40" width="50" height="2" fill="#3fb950" class="s3"/>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#21262d"/>

  <!-- Scene 1: WAL vs no WAL -->
  <g class="s1">
    <text x="60" y="76" font-size="12" class="muted">1 · the same 200,000 upserts into two identical tables</text>

    <g class="pop" style="animation-delay:0.6s">
      <text x="60" y="124" font-size="13">cache_logged</text>
      <rect x="200" y="102" width="90" height="34" rx="6" fill="none" stroke="#8b949e"/>
      <text x="245" y="124" font-size="13" text-anchor="middle">write</text>
      <line x1="292" y1="119" x2="326" y2="119" stroke="#8b949e" stroke-width="1.5"/>
      <path d="M320 114 L328 119 L320 124 Z" fill="#8b949e"/>
      <rect x="332" y="102" width="120" height="34" rx="6" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff"/>
      <text x="392" y="124" font-size="13" text-anchor="middle" class="blue">WAL journal</text>
      <line x1="454" y1="119" x2="488" y2="119" stroke="#8b949e" stroke-width="1.5"/>
      <path d="M482 114 L490 119 L482 124 Z" fill="#8b949e"/>
      <rect x="494" y="102" width="90" height="34" rx="6" fill="none" stroke="#8b949e"/>
      <text x="539" y="124" font-size="13" text-anchor="middle">table</text>
      <text x="600" y="124" font-size="12" class="green">crash-safe</text>
    </g>
    <g class="pop" style="animation-delay:2s">
      <text x="60" y="180" font-size="13">cache_unlogged</text>
      <rect x="200" y="158" width="90" height="34" rx="6" fill="none" stroke="#8b949e"/>
      <text x="245" y="180" font-size="13" text-anchor="middle">write</text>
      <rect x="332" y="158" width="120" height="34" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 3"/>
      <text x="392" y="180" font-size="13" text-anchor="middle" class="muted">skipped</text>
      <path d="M292 175 C 330 205, 450 205, 488 175" fill="none" stroke="#d29922" stroke-width="1.5"/>
      <path d="M481 172 L490 174 L485 182 Z" fill="#d29922"/>
      <rect x="494" y="158" width="90" height="34" rx="6" fill="none" stroke="#8b949e"/>
      <text x="539" y="180" font-size="13" text-anchor="middle">table</text>
      <text x="600" y="180" font-size="12" class="red">lost on crash</text>
    </g>

    <text x="60" y="236" font-size="12" class="muted pop" style="animation-delay:3.6s">WAL written</text>
    <rect x="200" y="226" width="536" height="14" rx="3" fill="#58a6ff" class="grow" style="animation-delay:3.6s"/>
    <rect x="200" y="252" width="9" height="14" rx="2" fill="#d29922" class="grow" style="animation-delay:3.6s"/>
    <text x="736" y="220" font-size="13" text-anchor="end" class="blue pop" style="animation-delay:5.6s">logged 67 MB</text>
    <text x="218" y="264" font-size="13" class="amber pop" style="animation-delay:5.6s">unlogged 1.1 MB  (≈ 60× less)</text>

    <g class="pop" style="animation-delay:7.4s">
      <text x="60" y="306" font-size="14">time: <tspan class="blue">14.7 s</tspan> vs <tspan class="amber">15.3 s</tspan> → same speed</text>
      <text x="60" y="328" font-size="12" class="muted">big batches = only 200 commits, so WAL wasn't the bottleneck</text>
    </g>
    <text x="60" y="372" font-size="13">UNLOGGED skips the crash journal: far less WAL, but measure before assuming speed.</text>
  </g>

  <!-- Scene 2: crash test -->
  <g class="s2">
    <text x="60" y="76" font-size="12" class="muted">2 · docker compose kill db  (= pulling the power cord)</text>

    <g fill="#161b22" stroke="#30363d">
      <rect x="90" y="110" width="250" height="120" rx="10"/>
      <rect x="460" y="110" width="250" height="120" rx="10"/>
    </g>
    <text x="215" y="136" font-size="14" text-anchor="middle">cache_logged</text>
    <text x="585" y="136" font-size="14" text-anchor="middle">cache_unlogged</text>

    <g class="brief" style="animation-delay:12.6s">
      <text x="215" y="184" font-size="26" font-weight="700" text-anchor="middle">1 row</text>
      <text x="585" y="184" font-size="26" font-weight="700" text-anchor="middle">2 rows</text>
      <text x="400" y="210" font-size="11" text-anchor="middle" class="muted">before</text>
    </g>
    <g class="brief" style="animation-delay:17.2s">
      <text x="400" y="186" font-size="22" font-weight="700" text-anchor="middle" class="red">⚡ SIGKILL</text>
    </g>
    <g class="pop" style="animation-delay:19s">
      <text x="215" y="184" font-size="26" font-weight="700" text-anchor="middle" class="green">1 row ✓</text>
      <text x="215" y="212" font-size="12" text-anchor="middle" class="muted">replayed from the WAL</text>
      <text x="585" y="184" font-size="26" font-weight="700" text-anchor="middle" class="red">0 rows ✗</text>
      <text x="585" y="212" font-size="12" text-anchor="middle" class="muted">reset to empty</text>
      <text x="400" y="210" font-size="11" text-anchor="middle" class="muted">after restart</text>
    </g>
    <g class="pop" style="animation-delay:20.4s">
      <text x="60" y="270" font-size="12" class="muted">postgres log</text>
      <text x="60" y="292" font-size="12">database system was not properly shut down; automatic recovery in progress</text>
      <text x="60" y="312" font-size="12">redo done … distance=69751 kB   <tspan class="muted">(≈ the 67 MB the benchmark wrote)</tspan></text>
    </g>
    <text x="60" y="372" font-size="13">After a crash Postgres replays the WAL, and resets unlogged tables to empty.</text>
  </g>

  <!-- Scene 3: cache + trigger invalidation -->
  <g class="s3">
    <text x="60" y="76" font-size="12" class="muted">3 · read-through cache + delete-on-write trigger</text>
    <g font-size="13">
      <g class="pop" style="animation-delay:24.6s">
        <text x="60" y="110">GET /products/1/cached</text>
        <text x="740" y="110" text-anchor="end" class="amber">MISS · stores product:1</text>
      </g>
      <g class="pop" style="animation-delay:26.6s">
        <text x="60" y="142">GET /products/1/cached</text>
        <text x="740" y="142" text-anchor="end" class="green">HIT · from cache (60 s TTL)</text>
      </g>
      <g class="pop" style="animation-delay:28.8s">
        <text x="60" y="182">PATCH /products/1/price  {"price": 80}</text>
        <rect x="60" y="192" width="680" height="30" rx="6" fill="#58a6ff" fill-opacity="0.08" stroke="#58a6ff"/>
        <text x="72" y="212" font-size="12" class="blue">trigger AFTER UPDATE ON "Product" → DELETE FROM cache_unlogged WHERE key = 'product:1'</text>
      </g>
      <g class="pop" style="animation-delay:31.2s">
        <text x="60" y="254">GET /products/1/cached</text>
        <text x="740" y="254" text-anchor="end" class="amber">MISS · price 80 ✓ fresh</text>
      </g>
      <g class="pop" style="animation-delay:33.6s">
        <text x="60" y="294">psql: UPDATE "Product" SET price = 55</text>
        <text x="740" y="294" text-anchor="end" class="amber">MISS · price 55 ✓</text>
        <text x="60" y="316" font-size="12" class="muted">the trigger fires for every writer, not just our API</text>
      </g>
    </g>
    <text x="60" y="372" font-size="13">Without the trigger, the cache would serve the old price for up to 60 s.</text>
  </g>
</svg>
