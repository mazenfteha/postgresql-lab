<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
  <title id="t">Phase 03: Vector search with pgvector</title>
  <desc id="d">Three scenes. 1: each product's name and description go through the local all-MiniLM-L6-v2 model and become 384 numbers stored in a vector(384) column; 5,000 products took 211.4 s on CPU. 2: similar products to "Modern Recycled Running Shoes" are its nearest neighbours by cosine distance, all running shoes at 0.19 to 0.24. 3: "something to keep my coffee hot" returns 0 rows with full-text search, while semantic search returns coffee grinders at distance about 0.51, a loose match.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #e6edf3; }
    .muted { fill: #8b949e; }
    .red { fill: #f85149; } .green { fill: #3fb950; } .blue { fill: #58a6ff; } .amber { fill: #d29922; }
    .s1, .s2, .s3, .pop, .grow {
      animation-duration: 20s; animation-iteration-count: infinite; animation-fill-mode: both;
    }
    .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; }
    .pop { animation-name: pop; animation-timing-function: ease-out; }
    .grow { animation-name: grow; animation-timing-function: linear; transform-box: fill-box; transform-origin: 0 50%; }

    /* 20s loop: scene 1 = 0-6s, scene 2 = 6-12s, scene 3 = 12-20s */
    @keyframes s1   { 0% { opacity: 0 } 2.5% { opacity: 1 } 27.5% { opacity: 1 } 30% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes s2   { 0%, 30% { opacity: 0 } 32.5% { opacity: 1 } 57.5% { opacity: 1 } 60% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes s3   { 0%, 60% { opacity: 0 } 62.5% { opacity: 1 } 97.5% { opacity: 1 } 100% { opacity: 0 } }
    /* relative to each element's animation-delay */
    @keyframes pop  { 0% { opacity: 0 } 3% { opacity: 1 } 40% { opacity: 1 } 42% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes grow { 0% { transform: scaleX(0) } 14% { transform: scaleX(1) } 40% { transform: scaleX(1) } 42% { transform: scaleX(0) } 100% { transform: scaleX(0) } }
  </style>

  <!-- card -->
  <rect x="0.5" y="0.5" width="799" height="399" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="36" font-size="17" font-weight="700">03 · Vector search with pgvector</text>
  <text x="500" y="34" font-size="12" class="muted">1 EMBED</text>
  <text x="575" y="34" font-size="12" class="muted">2 SIMILAR</text>
  <text x="664" y="34" font-size="12" class="muted">3 MEANING</text>
  <rect x="500" y="40" width="50" height="2" fill="#58a6ff" class="s1"/>
  <rect x="575" y="40" width="65" height="2" fill="#3fb950" class="s2"/>
  <rect x="664" y="40" width="65" height="2" fill="#d29922" class="s3"/>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#21262d"/>

  <!-- Scene 1: text -> 384 numbers -->
  <g class="s1">
    <text x="60" y="76" font-size="12" class="muted">1 · embed: text → 384 numbers (all-MiniLM-L6-v2, runs locally on CPU)</text>

    <g class="pop" style="animation-delay:0.3s">
      <rect x="60" y="90" width="270" height="44" rx="6" fill="none" stroke="#30363d"/>
      <text x="72" y="108" font-size="12">Modern Recycled Running Shoes.</text>
      <text x="72" y="124" font-size="11" class="muted">A … recycled running shoes, …</text>
    </g>
    <g class="pop" style="animation-delay:0.8s">
      <line x1="334" y1="112" x2="370" y2="112" stroke="#8b949e" stroke-width="1.5"/>
      <path d="M364 107 L372 112 L364 117 Z" fill="#8b949e"/>
      <rect x="378" y="90" width="120" height="44" rx="6" fill="#58a6ff" fill-opacity="0.08" stroke="#58a6ff"/>
      <text x="438" y="109" font-size="12" text-anchor="middle" class="blue">MiniLM</text>
      <text x="438" y="125" font-size="10" text-anchor="middle" class="muted">model</text>
      <line x1="502" y1="112" x2="530" y2="112" stroke="#8b949e" stroke-width="1.5"/>
      <path d="M524 107 L532 112 L524 117 Z" fill="#8b949e"/>
    </g>
    <!-- 40 of the 384 numbers: up = positive, down = negative -->
    <g class="pop" style="animation-delay:1.4s">
      <line x1="538" y1="112" x2="740" y2="112" stroke="#30363d"/>
      <g fill="#58a6ff">
        <rect x="540" y="106" width="3.5" height="6"/><rect x="550" y="98" width="3.5" height="14"/>
        <rect x="560" y="103" width="3.5" height="9"/><rect x="570" y="109" width="3.5" height="3"/>
        <rect x="575" y="101" width="3.5" height="11"/><rect x="585" y="100" width="3.5" height="12"/>
        <rect x="595" y="104" width="3.5" height="8"/><rect x="605" y="107" width="3.5" height="5"/>
        <rect x="610" y="96" width="3.5" height="16"/><rect x="620" y="110" width="3.5" height="2"/>
        <rect x="630" y="102" width="3.5" height="10"/><rect x="640" y="105" width="3.5" height="7"/>
        <rect x="650" y="99" width="3.5" height="13"/><rect x="660" y="108" width="3.5" height="4"/>
        <rect x="670" y="97" width="3.5" height="15"/><rect x="680" y="104" width="3.5" height="8"/>
        <rect x="690" y="101" width="3.5" height="11"/><rect x="700" y="109" width="3.5" height="3"/>
        <rect x="705" y="98" width="3.5" height="14"/><rect x="715" y="106" width="3.5" height="6"/>
        <rect x="725" y="103" width="3.5" height="9"/><rect x="735" y="100" width="3.5" height="12"/>
      </g>
      <g fill="#f85149">
        <rect x="545" y="112" width="3.5" height="10"/><rect x="555" y="112" width="3.5" height="4"/>
        <rect x="565" y="112" width="3.5" height="15"/><rect x="580" y="112" width="3.5" height="7"/>
        <rect x="590" y="112" width="3.5" height="2"/><rect x="600" y="112" width="3.5" height="13"/>
        <rect x="615" y="112" width="3.5" height="6"/><rect x="625" y="112" width="3.5" height="11"/>
        <rect x="635" y="112" width="3.5" height="3"/><rect x="645" y="112" width="3.5" height="14"/>
        <rect x="655" y="112" width="3.5" height="5"/><rect x="665" y="112" width="3.5" height="9"/>
        <rect x="675" y="112" width="3.5" height="1"/><rect x="685" y="112" width="3.5" height="12"/>
        <rect x="695" y="112" width="3.5" height="6"/><rect x="710" y="112" width="3.5" height="8"/>
        <rect x="720" y="112" width="3.5" height="16"/><rect x="730" y="112" width="3.5" height="4"/>
      </g>
      <text x="740" y="146" font-size="10" text-anchor="end" class="muted">384 numbers (40 shown)</text>
    </g>

    <text x="60" y="178" font-size="12" class="muted">npm run embed · 100 products per batch</text>
    <rect x="60" y="188" width="680" height="18" rx="4" fill="#21262d"/>
    <rect x="60" y="188" width="680" height="18" rx="4" fill="#58a6ff" fill-opacity="0.7" class="grow" style="animation-delay:2s"/>
    <text x="60" y="232" font-size="13" class="pop" style="animation-delay:2s">UPDATE "Product" SET embedding = '[…384 numbers…]'::vector</text>
    <text x="60" y="272" font-size="15" font-weight="700" class="green pop" style="animation-delay:4.8s">5,000 / 5,000 embedded</text>
    <text x="740" y="272" font-size="15" font-weight="700" text-anchor="end" class="blue pop" style="animation-delay:4.8s">211.4 s on CPU · ≈ 24 rows/s</text>
    <text x="60" y="304" font-size="12" class="muted pop" style="animation-delay:4.8s">+ CREATE INDEX … USING hnsw (embedding vector_cosine_ops)</text>
    <text x="60" y="362" font-size="13">Texts with similar meaning get similar numbers, stored in a vector(384) column.</text>
  </g>

  <!-- Scene 2: nearest neighbours -->
  <g class="s2">
    <text x="60" y="76" font-size="12" class="muted">2 · GET /products/1/similar → ORDER BY embedding &lt;=&gt; $1::vector LIMIT 5</text>

    <!-- meaning map (2D sketch of 384-D space) -->
    <rect x="60" y="92" width="330" height="232" rx="8" fill="#161b22" stroke="#30363d"/>
    <g class="pop" style="animation-delay:6.3s">
      <text x="72" y="110" font-size="10" class="muted">office</text>
      <g fill="#58a6ff" fill-opacity="0.6">
        <circle cx="120" cy="130" r="4"/><circle cx="145" cy="142" r="4"/><circle cx="110" cy="150" r="4"/><circle cx="152" cy="122" r="4"/>
      </g>
      <text x="300" y="110" font-size="10" class="muted">kitchen</text>
      <g fill="#d29922" fill-opacity="0.6">
        <circle cx="290" cy="132" r="4"/><circle cx="315" cy="150" r="4"/><circle cx="330" cy="128" r="4"/>
        <circle cx="300" cy="165" r="4"/><circle cx="340" cy="160" r="4"/><circle cx="275" cy="150" r="4"/>
      </g>
      <text x="320" y="316" font-size="10" class="muted">toys</text>
      <g fill="#bc8cff" fill-opacity="0.6">
        <circle cx="285" cy="262" r="4"/><circle cx="310" cy="285" r="4"/><circle cx="330" cy="262" r="4"/>
        <circle cx="295" cy="300" r="4"/><circle cx="345" cy="290" r="4"/>
      </g>
      <text x="72" y="316" font-size="10" class="muted">sports</text>
      <g fill="#3fb950" fill-opacity="0.35">
        <circle cx="190" cy="238" r="4"/><circle cx="90" cy="232" r="4"/><circle cx="185" cy="292" r="4"/>
      </g>
    </g>
    <!-- product 1 and its 5 nearest -->
    <g class="pop" style="animation-delay:7s">
      <path d="M140 250 l3.5 7.5 8 .8 -6 5.5 1.8 8 -7.3 -4.2 -7.3 4.2 1.8 -8 -6 -5.5 8 -.8 Z" transform="translate(0 -12)" fill="#e6edf3"/>
      <text x="140" y="214" font-size="10" text-anchor="middle">id 1</text>
    </g>
    <g stroke="#3fb950" stroke-width="1.5">
      <line x1="140" y1="250" x2="158" y2="238" class="pop" style="animation-delay:7.6s"/>
      <line x1="140" y1="250" x2="118" y2="236" class="pop" style="animation-delay:8s"/>
      <line x1="140" y1="250" x2="164" y2="268" class="pop" style="animation-delay:8.4s"/>
      <line x1="140" y1="250" x2="116" y2="272" class="pop" style="animation-delay:8.8s"/>
      <line x1="140" y1="250" x2="146" y2="280" class="pop" style="animation-delay:9.2s"/>
    </g>
    <g fill="#3fb950">
      <circle cx="158" cy="238" r="5" class="pop" style="animation-delay:7.6s"/>
      <circle cx="118" cy="236" r="5" class="pop" style="animation-delay:8s"/>
      <circle cx="164" cy="268" r="5" class="pop" style="animation-delay:8.4s"/>
      <circle cx="116" cy="272" r="5" class="pop" style="animation-delay:8.8s"/>
      <circle cx="146" cy="280" r="5" class="pop" style="animation-delay:9.2s"/>
    </g>

    <!-- result list -->
    <text x="420" y="110" font-size="13" font-weight="700" class="pop" style="animation-delay:7s">★ Modern Recycled Running Shoes</text>
    <text x="740" y="134" font-size="10" text-anchor="end" class="muted pop" style="animation-delay:7s">distance</text>
    <g font-size="13">
      <g class="pop" style="animation-delay:7.6s"><text x="420" y="158">Eco Recycled Running Shoes</text><text x="740" y="158" text-anchor="end" class="green">0.19</text></g>
      <g class="pop" style="animation-delay:8s"><text x="420" y="186">Rugged Recycled Running Shoes</text><text x="740" y="186" text-anchor="end" class="green">0.22</text></g>
      <g class="pop" style="animation-delay:8.4s"><text x="420" y="214">Deluxe Recycled Running Shoes</text><text x="740" y="214" text-anchor="end" class="green">0.23</text></g>
      <g class="pop" style="animation-delay:8.8s"><text x="420" y="242">Lightweight Aluminum Running…</text><text x="740" y="242" text-anchor="end" class="green">0.23</text></g>
      <g class="pop" style="animation-delay:9.2s"><text x="420" y="270">Pro Recycled Running Shoes</text><text x="740" y="270" text-anchor="end" class="green">0.24</text></g>
    </g>
    <text x="420" y="306" font-size="12" class="muted pop" style="animation-delay:9.8s">HNSW graph index: no full scan</text>
    <text x="60" y="362" font-size="13">&lt;=&gt; is cosine distance: 0 = same meaning, 1 = unrelated.</text>
  </g>

  <!-- Scene 3: meaning vs keywords -->
  <g class="s3">
    <text x="60" y="76" font-size="12" class="muted">3 · same question, two kinds of search</text>
    <g class="pop" style="animation-delay:12.3s">
      <rect x="60" y="88" width="680" height="34" rx="6" fill="none" stroke="#8b949e"/>
      <text x="400" y="110" font-size="14" text-anchor="middle">q = "something to keep my coffee hot"</text>
    </g>

    <!-- left: FTS -->
    <g class="pop" style="animation-delay:13s">
      <text x="60" y="152" font-size="13" font-weight="700">/search (full-text)</text>
      <text x="60" y="176" font-size="12" class="muted">needs EVERY word:</text>
      <text x="60" y="198" font-size="12">'someth' &amp; 'keep' &amp; 'coffe' &amp; 'hot'</text>
    </g>
    <g class="pop" style="animation-delay:14s">
      <text x="60" y="246" font-size="22" font-weight="700" class="red">[ ]  0 rows</text>
      <text x="60" y="272" font-size="12" class="muted">no product says "keep" + "hot"</text>
    </g>

    <line x1="400" y1="140" x2="400" y2="320" stroke="#21262d"/>

    <!-- right: semantic -->
    <g class="pop" style="animation-delay:13s">
      <text x="420" y="152" font-size="13" font-weight="700">/search/semantic</text>
      <text x="420" y="176" font-size="12" class="muted">embed q → nearest vectors</text>
    </g>
    <g font-size="12">
      <g class="pop" style="animation-delay:14.6s"><text x="420" y="204">Modern Wool Coffee Grinder</text><text x="740" y="204" text-anchor="end" class="amber">0.51</text></g>
      <g class="pop" style="animation-delay:15s"><text x="420" y="226">Mini Wool Coffee Grinder</text><text x="740" y="226" text-anchor="end" class="amber">0.51</text></g>
      <g class="pop" style="animation-delay:15.4s"><text x="420" y="248">Mini Wool Coffee Grinder</text><text x="740" y="248" text-anchor="end" class="amber">0.52</text></g>
      <g class="pop" style="animation-delay:15.8s"><text x="420" y="270">Essential Carbon Coffee Grinder</text><text x="740" y="270" text-anchor="end" class="amber">0.52</text></g>
      <g class="pop" style="animation-delay:16.2s"><text x="420" y="292">Eco Bamboo Coffee Grinder</text><text x="740" y="292" text-anchor="end" class="amber">0.52</text></g>
    </g>
    <text x="420" y="318" font-size="11" class="muted pop" style="animation-delay:16.8s">≈ 0.5 = loose match: it keyed on "coffee"</text>
    <text x="60" y="362" font-size="13">Meaning beats keywords, but the vectors only know what the text says.</text>
  </g>
</svg>
