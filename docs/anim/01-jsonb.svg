<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
  <title id="t">Phase 01: JSONB product attributes in Postgres</title>
  <desc id="d">Three scenes. 1: products with different attribute shapes (clothing, electronics, toys) all live in one jsonb column instead of many nullable columns. 2: the containment query attributes @> '{"color":"red"}' uses a GIN index: 3 index pages read, 474 rows found on 137 pages, 0.42 ms. 3: because the 474 red rows are spread over 137 of about 140 table pages, the index barely helps; a more selective filter like color red plus size XL touches only a few pages.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #e6edf3; }
    .muted { fill: #8b949e; }
    .red { fill: #f85149; } .green { fill: #3fb950; } .blue { fill: #58a6ff; } .yellow { fill: #d29922; }
    .s1, .s2, .s3, .pop, .hold {
      animation-duration: 20s; animation-iteration-count: infinite; animation-fill-mode: both;
    }
    .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; }
    .pop { animation-name: pop; animation-timing-function: ease-out; }
    .hold { animation-name: hold; animation-timing-function: ease-out; }

    /* 20s loop: scene 1 = 0-6s, scene 2 = 6-12s, scene 3 = 12-20s */
    @keyframes s1 { 0% { opacity: 0 } 2.5% { opacity: 1 } 27.5% { opacity: 1 } 30% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes s2 { 0%, 30% { opacity: 0 } 32.5% { opacity: 1 } 57.5% { opacity: 1 } 60% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes s3 { 0%, 60% { opacity: 0 } 62.5% { opacity: 1 } 97.5% { opacity: 1 } 100% { opacity: 0 } }
    /* relative to each element's animation-delay */
    @keyframes pop  { 0% { opacity: 0 } 3% { opacity: 1 } 40% { opacity: 1 } 42% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes hold { 0% { opacity: 0 } 3% { opacity: 1 } 17% { opacity: 1 } 19% { opacity: 0 } 100% { opacity: 0 } }
  </style>

  <defs>
    <pattern id="pages" x="60" y="150" width="34" height="28" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="30" height="22" rx="3" fill="#21262d"/>
    </pattern>
    <pattern id="pagesHit" x="60" y="150" width="34" height="28" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="30" height="22" rx="3" fill="#d29922"/>
    </pattern>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="799" height="399" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="36" font-size="17" font-weight="700">01 · JSONB: flexible product attributes</text>
  <text x="456" y="34" font-size="12" class="muted">1 SHAPES</text>
  <text x="538" y="34" font-size="12" class="muted">2 GIN</text>
  <text x="598" y="34" font-size="12" class="muted">3 SELECTIVITY</text>
  <rect x="456" y="40" width="58" height="2" fill="#58a6ff" class="s1"/>
  <rect x="538" y="40" width="36" height="2" fill="#3fb950" class="s2"/>
  <rect x="598" y="40" width="94" height="2" fill="#d29922" class="s3"/>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#21262d"/>

  <!-- Scene 1: one column, many shapes -->
  <g class="s1">
    <text x="60" y="76" font-size="12" class="muted">1 · every category has its own attributes</text>

    <g font-size="12">
      <g class="pop" style="animation-delay:0.3s">
        <rect x="60" y="88" width="210" height="84" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="74" y="108" font-weight="700" class="blue">Clothing</text>
        <text x="74" y="128">{"size": "M",</text>
        <text x="74" y="144"> "color": "red",</text>
        <text x="74" y="160"> "fabric": "wool"}</text>
      </g>
      <g class="pop" style="animation-delay:0.8s">
        <rect x="295" y="88" width="210" height="84" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="309" y="108" font-weight="700" class="blue">Electronics</text>
        <text x="309" y="128">{"brand": "Acme",</text>
        <text x="309" y="144"> "wireless": true,</text>
        <text x="309" y="160"> "warranty_years": 2, …}</text>
      </g>
      <g class="pop" style="animation-delay:1.3s">
        <rect x="530" y="88" width="210" height="84" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="544" y="108" font-weight="700" class="blue">Toys</text>
        <text x="544" y="128">{"age_min": 6,</text>
        <text x="544" y="144"> "pieces": 250}</text>
      </g>
    </g>

    <g class="pop" style="animation-delay:2.0s">
      <rect x="60" y="190" width="680" height="26" rx="4" fill="#161b22"/>
      <text x="72" y="208" font-size="12" class="muted">name</text>
      <text x="340" y="208" font-size="12" class="muted">category</text>
      <text x="460" y="208" font-size="12" class="blue">attributes jsonb</text>
    </g>
    <g class="pop" style="animation-delay:2.6s" font-size="12">
      <text x="72" y="236">Classic Cotton Rain Jacket</text>
      <text x="340" y="236">Clothing</text>
      <text x="460" y="236">{"size":"M","color":"red",…}</text>
      <text x="72" y="258">Mini Leather Wireless Headphones</text>
      <text x="340" y="258">Electronics</text>
      <text x="460" y="258">{"brand":"Acme","wireless":true,…}</text>
      <text x="72" y="280">Eco Oak Puzzle</text>
      <text x="340" y="280">Toys</text>
      <text x="460" y="280">{"age_min":6,"pieces":250}</text>
      <line x1="60" y1="244" x2="740" y2="244" stroke="#21262d"/>
      <line x1="60" y1="266" x2="740" y2="266" stroke="#21262d"/>
    </g>
    <text x="60" y="318" font-size="13" class="red pop" style="animation-delay:3.4s">instead of 9+ mostly-NULL columns (size, brand, pieces, …)</text>
    <text x="60" y="362" font-size="13">Shared fields stay real columns; the ones that vary live in one jsonb column.</text>
  </g>

  <!-- Scene 2: containment + GIN index -->
  <g class="s2">
    <text x="60" y="76" font-size="12" class="muted">2 · containment query + GIN index (jsonb_path_ops)</text>
    <text x="60" y="104" font-size="14" class="pop" style="animation-delay:6.3s">WHERE attributes <tspan class="blue">@&gt;</tspan> '{"color":"red"}'</text>

    <g class="pop" style="animation-delay:6.8s">
      <rect x="60" y="122" width="330" height="150" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="76" y="146" font-size="12" class="muted">GIN index: key/value → rows</text>
      <text x="76" y="178" font-size="13">color=red     → [474 rows]</text>
      <text x="76" y="206" font-size="13">size=XL       → […]</text>
      <text x="76" y="234" font-size="13">wireless=true → […]</text>
      <text x="76" y="258" font-size="11" class="muted">(stored as hashes: small and fast)</text>
    </g>
    <rect x="68" y="161" width="314" height="24" rx="4" fill="#3fb950" fill-opacity="0.18" stroke="#3fb950" class="pop" style="animation-delay:7.6s"/>

    <g font-size="12">
      <g class="pop" style="animation-delay:8.2s">
        <path d="M392 173 L414 173" stroke="#8b949e" stroke-width="1.5"/>
        <path d="M410 168 L418 173 L410 178 Z" fill="#8b949e"/>
        <rect x="422" y="122" width="318" height="40" rx="6" fill="none" stroke="#3fb950"/>
        <text x="436" y="140" font-weight="700" class="green">Bitmap Index Scan</text>
        <text x="436" y="155" class="muted">3 index pages read</text>
      </g>
      <g class="pop" style="animation-delay:8.8s">
        <path d="M581 164 L581 178" stroke="#8b949e" stroke-width="1.5"/>
        <path d="M576 174 L581 182 L586 174 Z" fill="#8b949e"/>
        <rect x="422" y="184" width="318" height="40" rx="6" fill="none" stroke="#3fb950"/>
        <text x="436" y="202" font-weight="700" class="green">Bitmap Heap Scan</text>
        <text x="436" y="217" class="muted">fetch 474 rows from 137 pages</text>
      </g>
      <g class="pop" style="animation-delay:9.4s">
        <path d="M581 226 L581 240" stroke="#8b949e" stroke-width="1.5"/>
        <path d="M576 236 L581 244 L586 236 Z" fill="#8b949e"/>
        <rect x="422" y="246" width="318" height="40" rx="6" fill="none" stroke="#30363d"/>
        <text x="436" y="264" font-weight="700">Recheck Cond</text>
        <text x="436" y="279" class="muted">hashes can collide, so re-test each row</text>
      </g>
    </g>

    <text x="60" y="318" font-size="14" class="muted pop" style="animation-delay:9.8s">planner guessed 457, got 474 ✓</text>
    <text x="740" y="318" font-size="15" font-weight="700" text-anchor="end" class="green pop" style="animation-delay:9.8s">with GIN index · 0.42 ms</text>
    <text x="60" y="362" font-size="13">The GIN index maps each key/value to rows, so @&gt; jumps straight to candidates.</text>
  </g>

  <!-- Scene 3: selectivity -->
  <g class="s3">
    <text x="60" y="76" font-size="12" class="muted">3 · how many table pages does the query touch?</text>
    <text x="60" y="144" font-size="11" class="muted">Product table pages (≈140)</text>
    <rect x="60" y="150" width="680" height="140" fill="url(#pages)"/>

    <!-- A: {"color":"red"} = not selective -->
    <g class="hold" style="animation-delay:12.3s">
      <text x="60" y="104" font-size="14">'{"color":"red"}'</text>
      <text x="60" y="124" font-size="12" class="muted">474 rows (≈9% of products), spread across the table</text>
      <rect x="60" y="150" width="680" height="140" fill="url(#pagesHit)"/>
      <g fill="#21262d">
        <rect x="164" y="209" width="30" height="22" rx="3"/>
        <rect x="470" y="265" width="30" height="22" rx="3"/>
        <rect x="674" y="153" width="30" height="22" rx="3"/>
      </g>
      <text x="740" y="318" font-size="15" font-weight="700" text-anchor="end" class="yellow">137 of ≈140 pages read: index barely helps</text>
    </g>

    <!-- B: {"color":"red","size":"XL"} = selective -->
    <g class="pop" style="animation-delay:16.4s">
      <text x="60" y="104" font-size="14">'{"color":"red","size":"XL"}'</text>
      <text x="60" y="124" font-size="12" class="muted">red AND XL clothing: only a few rows</text>
      <g fill="#3fb950">
        <rect x="96" y="153" width="30" height="22" rx="3"/>
        <rect x="198" y="237" width="30" height="22" rx="3"/>
        <rect x="266" y="181" width="30" height="22" rx="3"/>
        <rect x="334" y="265" width="30" height="22" rx="3"/>
        <rect x="368" y="209" width="30" height="22" rx="3"/>
        <rect x="436" y="153" width="30" height="22" rx="3"/>
        <rect x="504" y="237" width="30" height="22" rx="3"/>
        <rect x="572" y="181" width="30" height="22" rx="3"/>
        <rect x="606" y="265" width="30" height="22" rx="3"/>
        <rect x="640" y="209" width="30" height="22" rx="3"/>
        <rect x="708" y="237" width="30" height="22" rx="3"/>
        <rect x="130" y="265" width="30" height="22" rx="3"/>
      </g>
      <text x="740" y="318" font-size="15" font-weight="700" text-anchor="end" class="green">only a few pages read: index wins</text>
    </g>
    <text x="60" y="362" font-size="13">Indexes pay off when the filter is selective and the table is big.</text>
  </g>
</svg>
